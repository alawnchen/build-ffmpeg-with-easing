# ==============================================================================
# 工作流：编译 FFmpeg n8.0 + xfade-easing v3.6.0 macOS 通用二进制（x86_64 + arm64）
# ----------------------------------------------------------------------------
# 使用 macOS 15 (Apple Silicon arm64) 运行器，将 xfade-easing 缓动过渡效果
# 集成进 FFmpeg。arm64 为原生编译，x86_64 通过 clang -arch x86_64 交叉编译，
# 最终用 lipo 合并为 Mach-O 通用二进制。所有编解码库静态链接进可执行文件，
# 仅依赖 macOS 系统自带的 libSystem 与系统框架（CoreText、CoreFoundation 等）。
# 注意：macOS 不支持完全静态的可执行文件，故不使用 -static 标志。
# ==============================================================================
name: Build FFmpeg + xfade-easing (macOS Universal)

on:
  # 手动触发
  workflow_dispatch:
  push:
    # 推送到主分支时触发（含工作流文件自身的变更）
    branches:
      - mac
    # 推送 v 开头的标签时触发，用于自动发布 GitHub Release
    tags:
      - 'v*'

# 环境变量：版本号与仓库地址集中管理，便于后续升级
env:
  FFMPEG_TAG: n8.0                          # FFmpeg 源码标签（必须使用 n8.0 以保证补丁兼容）
  XFADE_EASING_TAG: v3.6.0                  # xfade-easing 版本标签
  XFADE_BASE: https://raw.githubusercontent.com/scriptituk/xfade-easing/v3.6.0/src
  DEPS_PREFIX: ${{ github.workspace }}/ffmpeg-deps   # 第三方编解码库静态安装前缀（每架构独立子目录）
  MACOSX_DEPLOYMENT_TARGET: "11.0"          # 兼容 macOS 11+（Big Sur 及以上）

# 发布 Release 需要对仓库内容的写入权限
permissions:
  contents: write

# 同一分支/标签的重复构建自动取消旧任务，节省资源
concurrency:
  group: build-ffmpeg-xfade-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 FFmpeg (macOS 通用二进制 x86_64 + arm64)
    runs-on: macos-15
    continue-on-error: false

    steps:
      # ----------------------------------------------------------------------
      # 步骤 1：安装构建依赖（Homebrew）
      #   注意：gperf 是 fontconfig meson 构建的硬性要求
      # ----------------------------------------------------------------------
      - name: 安装构建依赖 (Homebrew)
        run: |
          set -e
          brew install nasm yasm meson ninja pkg-config autoconf automake libtool gperf
          meson --version
          nasm --version

      # ----------------------------------------------------------------------
      # 步骤 2：检出 FFmpeg 源码（精确到 n8.0 标签，浅克隆加速）
      # ----------------------------------------------------------------------
      - name: 检出 FFmpeg 源码 (tag ${{ env.FFMPEG_TAG }})
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: ${{ env.FFMPEG_TAG }}
          path: ffmpeg
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # 步骤 3：下载并应用 xfade-easing 补丁
      #   - 始终放入头文件 libavfilter/xfade-easing.h（header-only 实现）
      #   - 优先尝试 patch 方式修改 vf_xfade.c；失败则直接替换整个文件
      # ----------------------------------------------------------------------
      - name: 应用 xfade-easing 补丁 (tag ${{ env.XFADE_EASING_TAG }})
        working-directory: ffmpeg
        run: |
          set -e
          PATCH_URL="${XFADE_BASE}/vf_xfade.patch"
          HEADER_URL="${XFADE_BASE}/xfade-easing.h"
          FULL_C_URL="${XFADE_BASE}/vf_xfade.c"

          # 下载 header-only 头文件到 libavfilter 目录
          curl -fL -o libavfilter/xfade-easing.h "${HEADER_URL}"
          # 校验下载内容非 404/HTML 错误页（必须包含核心函数）
          grep -q 'config_xfade_easing' libavfilter/xfade-easing.h || { echo "✗ xfade-easing.h 下载异常（疑似 404 页面）"; exit 1; }

          # 下载补丁并做干运行（dry-run）验证
          # 依次尝试 -p0（README 推荐）和 -p1（git 风格），均失败则直接替换整个文件
          curl -fL -o /tmp/vf_xfade.patch "${PATCH_URL}"
          grep -q 'easing' /tmp/vf_xfade.patch || { echo "✗ vf_xfade.patch 下载异常"; exit 1; }

          if patch -p0 --dry-run < /tmp/vf_xfade.patch >/dev/null 2>&1; then
            echo "✓ 补丁 (p0) 可正常应用，执行 patch -b -u -N -p0"
            patch -b -u -N -p0 < /tmp/vf_xfade.patch
          elif patch -p1 --dry-run < /tmp/vf_xfade.patch >/dev/null 2>&1; then
            echo "✓ 补丁 (p1) 可正常应用，执行 patch -b -u -N -p1"
            patch -b -u -N -p1 < /tmp/vf_xfade.patch
          else
            echo "✗ 补丁无法直接应用，回退为直接替换 libavfilter/vf_xfade.c"
            curl -fL -o libavfilter/vf_xfade.c "${FULL_C_URL}"
          fi

          echo "=== 验证关键文件已就位 ==="
          ls -la libavfilter/xfade-easing.h libavfilter/vf_xfade.c

          echo "=== 源码级验证：GL 转场与 easing/reverse 已集成 ==="
          # GL 转场为 GLSL 转译的纯 C 实现，全部内联在 xfade-easing.h 中
          grep -q 'gl_Swirl' libavfilter/xfade-easing.h || { echo "✗ 头文件缺少 GL 转场实现"; exit 1; }
          GL_COUNT=$(grep -oE 'gl_[A-Za-z_]+' libavfilter/xfade-easing.h | sort -u | wc -l)
          echo "✓ xfade-easing.h 内置 ${GL_COUNT} 个 GL 转场（纯 C 实现，无需 OpenGL）"
          # vf_xfade.c 必须已 include 头文件
          grep -q '#include "xfade-easing.h"' libavfilter/vf_xfade.c || { echo "✗ vf_xfade.c 未包含 xfade-easing.h"; exit 1; }
          # easing / reverse 选项注册是补丁生效的核心判据
          grep -q '"easing"' libavfilter/vf_xfade.c || { echo "✗ 缺少 easing 选项注册"; exit 1; }
          grep -q '"reverse"' libavfilter/vf_xfade.c || { echo "✗ 缺少 reverse 选项注册"; exit 1; }
          echo "✓ easing / reverse 选项已注册 —— GL 转场补丁完整生效"

      # ----------------------------------------------------------------------
      # 步骤 4：创建 meson x86_64 交叉编译文件
      #   arm64 为原生编译（无需 cross 文件），仅 x86_64 需要
      #   注意：不需要 needs_exe_wrapper（那是 Windows/wine 交叉编译专用）
      # ----------------------------------------------------------------------
      - name: 创建 meson x86_64 交叉编译文件
        run: |
          set -e
          cat > /tmp/cross-x86_64.meson << 'MESONEOF'
          [binaries]
          c = ['clang', '-arch', 'x86_64']
          cpp = ['clang++', '-arch', 'x86_64']
          ar = 'ar'
          ranlib = 'ranlib'
          strip = 'strip'
          pkg-config = 'pkg-config'

          [built-in options]
          c_args = ['-mmacosx-version-min=11.0']
          cpp_args = ['-mmacosx-version-min=11.0']
          c_link_args = ['-mmacosx-version-min=11.0']
          cpp_link_args = ['-mmacosx-version-min=11.0']

          [host_machine]
          system = 'darwin'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          MESONEOF

      # ----------------------------------------------------------------------
      # 步骤 5：编译 libopus（autotools，双架构静态编译）
      #   Opus 音频编解码器，构建最简单，最先编译
      # ----------------------------------------------------------------------
      - name: 编译 libopus (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fL -o /tmp/opus.tar.gz https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then HOST=aarch64-apple-darwin; else HOST=x86_64-apple-darwin; fi
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== libopus: 编译 ${ARCH} ==="
            mkdir -p /tmp/opus-${ARCH} && tar -xf /tmp/opus.tar.gz -C /tmp/opus-${ARCH} --strip-components=1
            cd /tmp/opus-${ARCH}
            export CC="clang -arch ${ARCH}"
            export CXX="clang++ -arch ${ARCH}"
            export CFLAGS="-arch ${ARCH} -O3"
            export CXXFLAGS="-arch ${ARCH} -O3"
            export LDFLAGS="-arch ${ARCH}"
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            ./configure \
              --host=${HOST} \
              --prefix=${PREFIX} \
              --disable-shared \
              --enable-static \
              --disable-extra-programs
            make -j"${JOBS}"
            make install
            echo "=== libopus (${ARCH}) 安装完成 ==="
            ls -la ${PREFIX}/lib/libopus.a ${PREFIX}/lib/pkgconfig/opus.pc
          done

      # ----------------------------------------------------------------------
      # 步骤 6：编译 libx264（自定义 configure，双架构静态编译）
      #   H.264/AVC 视频编解码器
      #   注意：macOS 上必须 --disable-opencl（自动检测的框架无法在静态链接中传递）
      # ----------------------------------------------------------------------
      - name: 编译 libx264 (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fL -o /tmp/x264.tar.gz https://code.videolan.org/videolan/x264/-/archive/stable/x264-stable.tar.gz
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then HOST=aarch64-apple-darwin; else HOST=x86_64-apple-darwin; fi
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== libx264: 编译 ${ARCH} ==="
            mkdir -p /tmp/x264-${ARCH} && tar -xf /tmp/x264.tar.gz -C /tmp/x264-${ARCH} --strip-components=1
            cd /tmp/x264-${ARCH}
            export CC="clang -arch ${ARCH}"
            export CXX="clang++ -arch ${ARCH}"
            export CFLAGS="-arch ${ARCH} -O3"
            export CXXFLAGS="-arch ${ARCH} -O3"
            export LDFLAGS="-arch ${ARCH}"
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            ./configure \
              --host=${HOST} \
              --prefix=${PREFIX} \
              --enable-static \
              --enable-pic \
              --disable-cli \
              --disable-lavf \
              --disable-swscale \
              --disable-opencl
            make -j"${JOBS}"
            make install
            echo "=== libx264 (${ARCH}) 安装完成 ==="
            ls -la ${PREFIX}/lib/libx264.a ${PREFIX}/lib/pkgconfig/x264.pc
          done

      # ----------------------------------------------------------------------
      # 步骤 7：编译 libvpx（自定义 configure，双架构静态编译）
      #   VP8/VP9 视频编解码器，含高位深支持
      #   注意：libvpx 架构由 CC/CXX 环境变量中的 -arch 控制，--target 仅选择汇编优化
      # ----------------------------------------------------------------------
      - name: 编译 libvpx (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fL -o /tmp/libvpx.tar.gz https://github.com/webmproject/libvpx/archive/refs/tags/v1.14.1.tar.gz
          for ARCH in arm64 x86_64; do
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== libvpx: 编译 ${ARCH} ==="
            mkdir -p /tmp/libvpx-${ARCH} && tar -xf /tmp/libvpx.tar.gz -C /tmp/libvpx-${ARCH} --strip-components=1
            cd /tmp/libvpx-${ARCH}
            export CC="clang -arch ${ARCH}"
            export CXX="clang++ -arch ${ARCH}"
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            ./configure \
              --target=${ARCH}-darwin22-gcc \
              --prefix=${PREFIX} \
              --disable-shared \
              --enable-static \
              --enable-pic \
              --disable-examples \
              --disable-tools \
              --disable-docs \
              --disable-unit-tests \
              --enable-vp9-highbitdepth
            make -j"${JOBS}"
            make install
            # ranlib 刷新静态库符号索引
            ranlib ${PREFIX}/lib/libvpx.a
            echo "=== libvpx (${ARCH}) 安装完成 ==="
            ls -la ${PREFIX}/lib/libvpx.a ${PREFIX}/lib/pkgconfig/vpx.pc
          done

      # ----------------------------------------------------------------------
      # 步骤 8：编译 libx265（CMake 多位深静态编译，双架构）
      #   H.265/HEVC 视频编解码器，含 8/10/12-bit 多位深合并
      #   关键：macOS 的 BSD ar 不支持 MRI 脚本，必须用 /usr/bin/libtool -static 合并
      #   关键：x265.pc 中的 -lstdc++ 需修正为 -lc++（clang 默认 C++ 标准库）
      # ----------------------------------------------------------------------
      - name: 编译 libx265 (CMake 多位深, arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          # 官方 x265 源码在 Bitbucket（github.com/videolan/x265 镜像缺少 3.5 标签）
          # 优先 VideoLAN CDN release tarball（快、无 git）；失败则回退 Bitbucket 官方仓库
          X265_VER="3.5"
          if curl -fsL -o /tmp/x265.tar.gz "https://get.videolan.org/x265/x265_${X265_VER}.tar.gz"; then
            echo "✓ 使用 VideoLAN CDN tarball (x265_${X265_VER})"
          else
            echo "VideoLAN CDN 下载失败，回退到 Bitbucket 官方仓库"
            curl -fsL -o /tmp/x265.tar.gz "https://bitbucket.org/multicoreware/x265_git/get/${X265_VER}.tar.gz"
          fi
          for ARCH in arm64 x86_64; do
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== libx265: 编译 ${ARCH} ==="
            mkdir -p /tmp/x265-${ARCH} && tar -xf /tmp/x265.tar.gz -C /tmp/x265-${ARCH} --strip-components=1
            cd /tmp/x265-${ARCH}
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"

            # 修补 CMakeLists.txt：CMake 4.x 不允许 CMP0025/CMP0054 设为 OLD
            sed -i '' 's/cmake_policy(SET CMP0025 OLD)/cmake_policy(SET CMP0025 NEW)/' source/CMakeLists.txt
            sed -i '' 's/cmake_policy(SET CMP0054 OLD)/cmake_policy(SET CMP0054 NEW)/' source/CMakeLists.txt

            # 12-bit 构建
            cmake \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_INSTALL_PREFIX=${PREFIX} \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${ARCH} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
              -DENABLE_SHARED=OFF \
              -DENABLE_CLI=OFF \
              -DHIGH_BIT_DEPTH=ON \
              -DEXPORT_C_API=OFF \
              -DENABLE_HDR10_PLUS=ON \
              -DMAIN12=ON \
              -S source \
              -B 12bit
            make -C 12bit -j"${JOBS}"

            # 10-bit 构建
            cmake \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_INSTALL_PREFIX=${PREFIX} \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${ARCH} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
              -DENABLE_SHARED=OFF \
              -DENABLE_CLI=OFF \
              -DHIGH_BIT_DEPTH=ON \
              -DEXPORT_C_API=OFF \
              -DENABLE_HDR10_PLUS=ON \
              -S source \
              -B 10bit
            make -C 10bit -j"${JOBS}"

            # 8-bit 构建（链接 10-bit 和 12-bit）
            cmake \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_INSTALL_PREFIX=${PREFIX} \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${ARCH} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
              -DENABLE_SHARED=OFF \
              -DENABLE_CLI=OFF \
              -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
              -DEXTRA_LINK_FLAGS=-L. \
              -DLINKED_10BIT=ON \
              -DLINKED_12BIT=ON \
              -S source \
              -B 8bit
            make -C 8bit -j"${JOBS}"

            # 合并三个位深的静态库为单个 libx265.a
            # 关键：BSD libtool（非 GNU），ar -M 在 macOS 上不受支持
            cd 8bit
            mv ../12bit/libx265.a libx265_main12.a
            mv ../10bit/libx265.a libx265_main10.a
            mv libx265.a libx265_main.a
            /usr/bin/libtool -static -o libx265.a libx265_main.a libx265_main10.a libx265_main12.a

            # 安装头文件和静态库
            make install
            cd ..

            # x265 是 C++ 库：macOS clang 默认链接 libc++，需修正 x265.pc 中的 -lstdc++
            sed -i '' 's/-lstdc++/-lc++/g' ${PREFIX}/lib/pkgconfig/x265.pc

            echo "=== libx265 (${ARCH}) 安装完成 ==="
            ls -la ${PREFIX}/lib/libx265.a ${PREFIX}/lib/pkgconfig/x265.pc
          done

      # ----------------------------------------------------------------------
      # 步骤 9：编译 libmp3lame（autotools，双架构静态编译）
      #   MP3 音频编码库，无外部依赖
      # ----------------------------------------------------------------------
      - name: 编译 libmp3lame (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fsL -o /tmp/lame.tar.gz https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then HOST=aarch64-apple-darwin; else HOST=x86_64-apple-darwin; fi
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== libmp3lame: 编译 ${ARCH} ==="
            mkdir -p /tmp/lame-${ARCH} && tar -xf /tmp/lame.tar.gz -C /tmp/lame-${ARCH} --strip-components=1
            cd /tmp/lame-${ARCH}
            export CC="clang -arch ${ARCH}"
            export CXX="clang++ -arch ${ARCH}"
            export CFLAGS="-arch ${ARCH} -O3"
            export CXXFLAGS="-arch ${ARCH} -O3"
            export LDFLAGS="-arch ${ARCH}"
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            ./configure \
              --host=${HOST} \
              --prefix=${PREFIX} \
              --disable-shared \
              --enable-static \
              --disable-frontend \
              --disable-nasm
            make -j"${JOBS}"
            make install
            echo "=== libmp3lame (${ARCH}) 安装完成 ==="
            ls -la ${PREFIX}/lib/libmp3lame.a ${PREFIX}/include/lame/lame.h
          done

      # ----------------------------------------------------------------------
      # 步骤 10：编译 libfreetype（autotools，先不带 harfbuzz 以打破循环依赖）
      #   ASS 字幕渲染所需的字体光栅化库
      #   注意：macOS SDK 不提供 zlib.pc，必须 --without-zlib
      # ----------------------------------------------------------------------
      - name: 编译 libfreetype (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fsL -o /tmp/freetype.tar.xz https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then HOST=aarch64-apple-darwin; else HOST=x86_64-apple-darwin; fi
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== libfreetype: 编译 ${ARCH} ==="
            mkdir -p /tmp/freetype-${ARCH} && tar -xf /tmp/freetype.tar.xz -C /tmp/freetype-${ARCH} --strip-components=1
            cd /tmp/freetype-${ARCH}
            export CC="clang -arch ${ARCH}"
            export CXX="clang++ -arch ${ARCH}"
            export CFLAGS="-arch ${ARCH} -O3"
            export CXXFLAGS="-arch ${ARCH} -O3"
            export LDFLAGS="-arch ${ARCH}"
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            ./configure \
              --host=${HOST} \
              --prefix=${PREFIX} \
              --disable-shared \
              --enable-static \
              --without-harfbuzz \
              --without-bzip2 \
              --without-png \
              --without-brotli \
              --without-zlib
            make -j"${JOBS}"
            make install
            echo "=== libfreetype (${ARCH}) 安装完成 ==="
          done

      # ----------------------------------------------------------------------
      # 步骤 11：编译 libfribidi（meson，双架构静态编译）
      #   Unicode 双向文本（BiDi）处理库，ASS 字幕渲染依赖
      #   arm64 原生编译无需 cross 文件；x86_64 使用 /tmp/cross-x86_64.meson
      #   注意：BSD sed 语法为 sed -i ''（空字符串参数）
      # ----------------------------------------------------------------------
      - name: 编译 libfribidi (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fsL -o /tmp/fribidi.tar.xz https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz
          for ARCH in arm64 x86_64; do
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            CROSS_OPT=$([ "$ARCH" = "x86_64" ] && echo "--cross-file=/tmp/cross-x86_64.meson" || echo "")
            echo "=== libfribidi: 编译 ${ARCH} ==="
            mkdir -p /tmp/fribidi-${ARCH} && tar -xf /tmp/fribidi.tar.xz -C /tmp/fribidi-${ARCH} --strip-components=1
            cd /tmp/fribidi-${ARCH}
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            meson setup build ${CROSS_OPT} \
              --prefix=${PREFIX} \
              --buildtype=release \
              --default-library=static \
              -Dbin=false -Ddocs=false -Dtests=false
            ninja -C build
            ninja -C build install
            # 静态使用时消费方需要该宏（BtbN 同款补丁）
            sed -i '' 's/Cflags:/Cflags: -DFRIBIDI_LIB_STATIC/' ${PREFIX}/lib/pkgconfig/fribidi.pc
            echo "=== libfribidi (${ARCH}) 安装完成 ==="
          done

      # ----------------------------------------------------------------------
      # 步骤 12：编译 libunibreak（autotools，libass 0.17 必需依赖）
      #   Unicode 换行算法库
      # ----------------------------------------------------------------------
      - name: 编译 libunibreak (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fsL -o /tmp/libunibreak.tar.gz https://github.com/adah1972/libunibreak/releases/download/libunibreak_6_1/libunibreak-6.1.tar.gz
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then HOST=aarch64-apple-darwin; else HOST=x86_64-apple-darwin; fi
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== libunibreak: 编译 ${ARCH} ==="
            mkdir -p /tmp/unibreak-${ARCH} && tar -xf /tmp/libunibreak.tar.gz -C /tmp/unibreak-${ARCH} --strip-components=1
            cd /tmp/unibreak-${ARCH}
            export CC="clang -arch ${ARCH}"
            export CXX="clang++ -arch ${ARCH}"
            export CFLAGS="-arch ${ARCH} -O3"
            export CXXFLAGS="-arch ${ARCH} -O3"
            export LDFLAGS="-arch ${ARCH}"
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            ./configure \
              --host=${HOST} \
              --prefix=${PREFIX} \
              --disable-shared \
              --enable-static \
              --with-pic
            make -j"${JOBS}"
            make install
            echo "=== libunibreak (${ARCH}) 安装完成 ==="
          done

      # ----------------------------------------------------------------------
      # 步骤 13：编译 libharfbuzz（meson，依赖 freetype，双架构）
      #   文本整形（shaping）引擎
      #   注意：-Dcoretext=enabled 取代 Windows 版的 -Dgdi=enabled；
      #   构建后需验证 harfbuzz.pc 含 -framework CoreText，缺失则手动补上
      # ----------------------------------------------------------------------
      - name: 编译 libharfbuzz (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fsL -o /tmp/harfbuzz.tar.gz https://github.com/harfbuzz/harfbuzz/archive/refs/tags/10.4.0.tar.gz
          for ARCH in arm64 x86_64; do
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            CROSS_OPT=$([ "$ARCH" = "x86_64" ] && echo "--cross-file=/tmp/cross-x86_64.meson" || echo "")
            echo "=== libharfbuzz: 编译 ${ARCH} ==="
            mkdir -p /tmp/harfbuzz-${ARCH} && tar -xf /tmp/harfbuzz.tar.gz -C /tmp/harfbuzz-${ARCH} --strip-components=1
            cd /tmp/harfbuzz-${ARCH}
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            meson setup build ${CROSS_OPT} \
              --prefix=${PREFIX} \
              --buildtype=release \
              --default-library=static \
              -Dfreetype=enabled -Dglib=disabled -Dgobject=disabled -Dcairo=disabled \
              -Dchafa=disabled -Dtests=disabled -Dintrospection=disabled -Ddocs=disabled \
              -Ddoc_tests=false -Dutilities=disabled -Dcoretext=enabled
            ninja -C build
            ninja -C build install
            # CoreText 框架链接：静态链接时必须能从 harfbuzz.pc 取到 framework 标志
            if ! grep -q 'framework CoreText' ${PREFIX}/lib/pkgconfig/harfbuzz.pc; then
              echo "⚠ harfbuzz.pc 缺少 -framework CoreText，手动补上"
              sed -i '' 's/^Libs.private:\(.*\)$/Libs.private:\1 -framework CoreText -framework CoreFoundation/' ${PREFIX}/lib/pkgconfig/harfbuzz.pc
            fi
            echo "=== libharfbuzz (${ARCH}) 安装完成 ==="
          done

      # ----------------------------------------------------------------------
      # 步骤 14：编译 expat（autotools，fontconfig 的 XML 后端依赖）
      # ----------------------------------------------------------------------
      - name: 编译 expat (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fsL -o /tmp/expat.tar.xz https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.xz
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then HOST=aarch64-apple-darwin; else HOST=x86_64-apple-darwin; fi
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== expat: 编译 ${ARCH} ==="
            mkdir -p /tmp/expat-${ARCH} && tar -xf /tmp/expat.tar.xz -C /tmp/expat-${ARCH} --strip-components=1
            cd /tmp/expat-${ARCH}
            export CC="clang -arch ${ARCH}"
            export CXX="clang++ -arch ${ARCH}"
            export CFLAGS="-arch ${ARCH} -O3"
            export CXXFLAGS="-arch ${ARCH} -O3"
            export LDFLAGS="-arch ${ARCH}"
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            ./configure \
              --host=${HOST} \
              --prefix=${PREFIX} \
              --disable-shared \
              --enable-static \
              --without-docbook \
              --without-examples \
              --without-tests
            make -j"${JOBS}"
            make install
            echo "=== expat (${ARCH}) 安装完成 ==="
          done

      # ----------------------------------------------------------------------
      # 步骤 15：编译 fontconfig（meson，expat 后端，双架构）
      #   字体发现与配置库
      #   前置条件：brew install gperf（fontconfig meson 构建的硬性要求，步骤 1 已安装）
      # ----------------------------------------------------------------------
      - name: 编译 fontconfig (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fsL -o /tmp/fontconfig.tar.xz https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.16.0.tar.xz
          for ARCH in arm64 x86_64; do
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            CROSS_OPT=$([ "$ARCH" = "x86_64" ] && echo "--cross-file=/tmp/cross-x86_64.meson" || echo "")
            echo "=== fontconfig: 编译 ${ARCH} ==="
            mkdir -p /tmp/fontconfig-${ARCH} && tar -xf /tmp/fontconfig.tar.xz -C /tmp/fontconfig-${ARCH} --strip-components=1
            cd /tmp/fontconfig-${ARCH}
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            meson setup build ${CROSS_OPT} \
              --prefix=${PREFIX} \
              --buildtype=release \
              --default-library=static \
              -Ddoc=disabled -Dtools=disabled -Dtests=disabled \
              -Dcache-build=disabled -Diconv=disabled
            ninja -C build
            meson install -C build --no-rebuild
            # 清除无效 cache/config 残留
            rm -rf ${PREFIX}/var ${PREFIX}/share ${PREFIX}/etc
            echo "=== fontconfig (${ARCH}) 安装完成 ==="
          done

      # ----------------------------------------------------------------------
      # 步骤 16：编译 libass（autotools，依赖以上全部字幕相关库）
      #   ASS/SSA 字幕渲染库
      # ----------------------------------------------------------------------
      - name: 编译 libass (arm64 + x86_64)
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          curl -fsL -o /tmp/libass.tar.xz https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then HOST=aarch64-apple-darwin; else HOST=x86_64-apple-darwin; fi
            PREFIX="${DEPS_PREFIX}/${ARCH}"
            echo "=== libass: 编译 ${ARCH} ==="
            mkdir -p /tmp/libass-${ARCH} && tar -xf /tmp/libass.tar.xz -C /tmp/libass-${ARCH} --strip-components=1
            cd /tmp/libass-${ARCH}
            export CC="clang -arch ${ARCH}"
            export CXX="clang++ -arch ${ARCH}"
            export CFLAGS="-arch ${ARCH} -O3"
            export CXXFLAGS="-arch ${ARCH} -O3"
            export LDFLAGS="-arch ${ARCH}"
            export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
            ./configure \
              --host=${HOST} \
              --prefix=${PREFIX} \
              --disable-shared \
              --enable-static
            make -j"${JOBS}"
            make install
            echo "=== libass (${ARCH}) 安装完成 ==="
            ls -la ${PREFIX}/lib/libass.a ${PREFIX}/lib/pkgconfig/libass.pc
          done

      # ----------------------------------------------------------------------
      # 步骤 17：配置并编译 FFmpeg —— arm64（原生，VPATH 构建目录 build-arm64）
      #   静态链接所有编解码库与字幕渲染栈
      #   注意：macOS 不支持完全静态可执行文件，不使用 -static 标志；
      #   使用 PKG_CONFIG_LIBDIR（替换）而非 PKG_CONFIG_PATH（追加），避免 Homebrew 污染
      # ----------------------------------------------------------------------
      - name: 配置并编译 FFmpeg (arm64 原生)
        working-directory: ffmpeg
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          # 诊断：检查 libass 及其静态依赖链是否可解析
          echo "=== pkg-config 诊断 (arm64) ==="
          ls ${DEPS_PREFIX}/arm64/lib/pkgconfig/*.pc 2>/dev/null || echo "(无)"
          PKG_CONFIG_LIBDIR=${DEPS_PREFIX}/arm64/lib/pkgconfig \
            pkg-config --exists --print-errors --static libass \
            || { echo "✗ pkg-config 无法解析 libass（含静态依赖链）"; exit 1; }
          echo "✓ pkg-config 成功解析 libass（含全部静态依赖）"

          mkdir build-arm64
          cd build-arm64
          PKG_CONFIG_LIBDIR=${DEPS_PREFIX}/arm64/lib/pkgconfig \
          ../configure \
            --pkg-config=pkg-config \
            --pkg-config-flags="--static" \
            --arch=arm64 \
            --target-os=darwin \
            --cc="clang -arch arm64" \
            --enable-static \
            --disable-shared \
            --extra-cflags="-I${DEPS_PREFIX}/arm64/include" \
            --extra-ldflags="-L${DEPS_PREFIX}/arm64/lib" \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libmp3lame \
            --enable-libass \
            --enable-libfreetype \
            --enable-libfribidi \
            --enable-libharfbuzz \
            --enable-fontconfig
          # 使用 ECFLAGS 禁用 C99 混合声明警告，避免 xfade-easing 触发告警
          make -j"${JOBS}" ECFLAGS=-Wno-declaration-after-statement

      # ----------------------------------------------------------------------
      # 步骤 18：配置并编译 FFmpeg —— x86_64（从 arm64 交叉编译）
      #   使用 VPATH 构建目录 build-x86_64，与 arm64 构建互不干扰
      #   x86_64 需要 --enable-cross-compile
      # ----------------------------------------------------------------------
      - name: 配置并编译 FFmpeg (x86_64 交叉编译)
        working-directory: ffmpeg
        run: |
          set -e
          JOBS="$(sysctl -n hw.ncpu)"
          echo "=== pkg-config 诊断 (x86_64) ==="
          ls ${DEPS_PREFIX}/x86_64/lib/pkgconfig/*.pc 2>/dev/null || echo "(无)"
          PKG_CONFIG_LIBDIR=${DEPS_PREFIX}/x86_64/lib/pkgconfig \
            pkg-config --exists --print-errors --static libass \
            || { echo "✗ pkg-config 无法解析 libass（含静态依赖链）"; exit 1; }
          echo "✓ pkg-config 成功解析 libass（含全部静态依赖）"

          mkdir build-x86_64
          cd build-x86_64
          PKG_CONFIG_LIBDIR=${DEPS_PREFIX}/x86_64/lib/pkgconfig \
          ../configure \
            --pkg-config=pkg-config \
            --pkg-config-flags="--static" \
            --arch=x86_64 \
            --target-os=darwin \
            --enable-cross-compile \
            --cc="clang -arch x86_64" \
            --enable-static \
            --disable-shared \
            --extra-cflags="-I${DEPS_PREFIX}/x86_64/include" \
            --extra-ldflags="-L${DEPS_PREFIX}/x86_64/lib" \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libmp3lame \
            --enable-libass \
            --enable-libfreetype \
            --enable-libfribidi \
            --enable-libharfbuzz \
            --enable-fontconfig
          make -j"${JOBS}" ECFLAGS=-Wno-declaration-after-statement

      # ----------------------------------------------------------------------
      # 步骤 19：lipo 合并双架构可执行文件为 Mach-O 通用二进制
      # ----------------------------------------------------------------------
      - name: lipo 合并为通用二进制
        working-directory: ffmpeg
        run: |
          set -e
          lipo -create build-arm64/ffmpeg build-x86_64/ffmpeg -output ffmpeg-macos-universal
          lipo -create build-arm64/ffprobe build-x86_64/ffprobe -output ffprobe-macos-universal
          echo "=== lipo -info 验证架构 ==="
          lipo -info ffmpeg-macos-universal
          lipo -info ffprobe-macos-universal
          echo "=== file 验证 Mach-O 通用二进制 ==="
          file ffmpeg-macos-universal ffprobe-macos-universal

      # ----------------------------------------------------------------------
      # 步骤 20：功能验证 —— 实际运行通用二进制，证明 GL 转场可用
      #   判据 1：-h filter=xfade 出现 easing/reverse 选项（补丁生效）
      #   判据 2：用 gl_Swirl 实际渲染一段转场（GL 转场真正执行）
      #   注意：gl_* 转场为运行时字符串解析，不会出现在 -h 的 transition 枚举列表中
      # ----------------------------------------------------------------------
      - name: 功能验证 GL 转场 (原生运行)
        working-directory: ffmpeg
        continue-on-error: true
        run: |
          set -e
          # sanity check：确认可执行文件能正常运行
          echo "=== sanity check ==="
          ./ffmpeg-macos-universal -version 2>&1 | head -3 \
            || { echo "✗ 无法运行 ffmpeg-macos-universal"; exit 1; }

          echo "=== 判据 1：xfade 滤镜出现 easing/reverse 选项（补丁生效）==="
          ./ffmpeg-macos-universal -hide_banner -h filter=xfade > /tmp/xfade_help.txt 2>&1
          echo "--- xfade 滤镜帮助输出（前 30 行）---"
          head -30 /tmp/xfade_help.txt
          grep -iE 'easing|reverse' /tmp/xfade_help.txt \
            || { echo "✗ 未发现 easing/reverse 选项，补丁未生效"; exit 1; }
          echo "✓ 补丁生效（easing/reverse 选项已注册）"

          echo "=== 判据 2：GL 转场 gl_Swirl 实际渲染冒烟测试 ==="
          ./ffmpeg-macos-universal -hide_banner \
            -f lavfi -i color=c=red:s=320x240:d=3 \
            -f lavfi -i color=c=blue:s=320x240:d=3 \
            -filter_complex "xfade=duration=1:offset=1:easing=quartic-out:transition=gl_Swirl" \
            -f null -
          echo "✓ GL 转场 (gl_Swirl) 渲染成功 —— GL 转场已完整可用"

      # ----------------------------------------------------------------------
      # 步骤 21：验证通用二进制仅依赖 macOS 系统库
      #   otool -L 应仅显示 /usr/lib 与 /System/Library/Frameworks 下的系统库；
      #   所有编解码库均已静态链接，不应出现第三方动态库（如 Homebrew 路径）
      # ----------------------------------------------------------------------
      - name: 验证二进制仅依赖系统库
        working-directory: ffmpeg
        run: |
          set -e
          echo "=== ffmpeg otool -L 动态库依赖检查 ==="
          otool -L ffmpeg-macos-universal
          echo "=== ffprobe otool -L 动态库依赖检查 ==="
          otool -L ffprobe-macos-universal
          # 不允许出现 /opt/homebrew 或 /usr/local 等第三方路径
          if otool -L ffmpeg-macos-universal | grep -E '/opt/homebrew|/usr/local/' ; then
            echo "✗ 发现第三方动态库依赖（Homebrew 污染）"
            exit 1
          fi
          echo "✓ 无第三方动态库依赖（仅系统库）"
          echo "=== 文件信息 ==="
          file ffmpeg-macos-universal ffprobe-macos-universal
          ls -la ffmpeg-macos-universal ffprobe-macos-universal

      # ----------------------------------------------------------------------
      # 步骤 22：上传构建产物（ffmpeg + ffprobe 通用二进制），保留 30 天
      # ----------------------------------------------------------------------
      - name: 上传 ffmpeg 与 ffprobe 通用二进制
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-xfade-easing-codecs-macos-universal
          path: |
            ffmpeg/ffmpeg-macos-universal
            ffmpeg/ffprobe-macos-universal
          retention-days: 30
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # 步骤 23：发布 GitHub Release（仅当推送 v 开头标签时执行）
      # ----------------------------------------------------------------------
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: FFmpeg xfade-easing ${{ github.ref_name }}
          body: |
            基于 **FFmpeg ${{ env.FFMPEG_TAG }}** + **xfade-easing ${{ env.XFADE_EASING_TAG }}** 构建的 macOS 通用二进制（x86_64 + arm64）。

            集成编解码库：
            - libx264 (H.264/AVC)
            - libx265 (H.265/HEVC，含 8/10/12-bit 多位深)
            - libvpx (VP8/VP9，含高位深)
            - libopus (Opus 音频)
            - libass + freetype + fribidi + harfbuzz + fontconfig (ASS/SRT 字幕渲染)
            - xfade-easing 缓动过渡效果

            > **GL 转场说明**：`gl_*` 系列转场（如 `gl_Swirl`、`gl_cube`）已内置，为 GLSL 转译的纯 C 实现，无需 OpenGL。
            > 它们通过字符串名调用（如 `transition=gl_Swirl`），**不会**出现在 `ffmpeg -h filter=xfade` 的 transition 列表中；
            > 以 `-h filter=xfade` 输出中出现 `easing` / `reverse` 选项作为补丁生效判据。

            - `ffmpeg-macos-universal` — Mach-O 通用二进制（x86_64 + arm64），兼容 macOS 11+，仅依赖系统自带库
            - `ffprobe-macos-universal` — 媒体分析工具
          files: |
            ffmpeg/ffmpeg-macos-universal
            ffmpeg/ffprobe-macos-universal
          draft: false
          prerelease: false
