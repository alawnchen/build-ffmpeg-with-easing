name: Build FFmpeg (Windows) with xfade-easing

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # ----------------------------------------------
      # 1. 安装依赖
      # ----------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y             \
            git wget curl subversion       \
            build-essential pkg-config     \
            texinfo yasm cmake nasm        \
            mingw-w64-x86-64-gcc           \
            mingw-w64-x86-64-g++           \
            autoconf automake libtool      \
            patch

      # ----------------------------------------------
      # 2. 克隆辅助编译脚本
      # ----------------------------------------------
      - name: Clone ffmpeg-windows-build-helpers
        run: |
          git clone https://github.com/rdp/ffmpeg-windows-build-helpers.git

      # ----------------------------------------------
      # 3. 准备打过 xfade-easing 补丁的 FFmpeg 源码
      # ----------------------------------------------
      - name: Prepare patched FFmpeg source
        run: |
          set -e  # 任何命令失败立即退出

          # 克隆 FFmpeg n8.0（请根据补丁兼容性调整分支）
          git clone --depth 1 --branch n8.0 \
            https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg_patched

          cd /tmp/ffmpeg_patched

          # 获取 xfade-easing 补丁
          git clone https://github.com/scriptituk/xfade-easing.git xfade_easing
          cp xfade_easing/src/xfade-easing.h libavfilter/

          # 检查补丁能否干用（--dry-run 不会实际修改）
          echo "::group::Check patch applicability"
          if ! patch --dry-run -p1 < xfade_easing/src/vf_xfade.patch; then
            echo "::error::Patch does not apply cleanly. Check FFmpeg version compatibility."
            exit 1
          fi
          echo "::endgroup::"

          # 正式打补丁
          patch -p1 < xfade_easing/src/vf_xfade.patch

          # 提交为本地 commit
          git add -A
          git -c user.name="CI" -c user.email="ci@localhost" commit -m "apply xfade-easing"

          echo "Patched FFmpeg source ready at /tmp/ffmpeg_patched"

      # ----------------------------------------------
      # 4. 执行交叉编译（使用本地已打补丁的目录）
      # ----------------------------------------------
      - name: Run cross-compile script
        run: |
          cd ffmpeg-windows-build-helpers

          ./cross_compile_ffmpeg.sh \
            --compiler-flavors=win64          \
            --disable-nonfree=y               \
            --build-ffprobe=y                 \
            --build-libx264=y                 \
            --build-libx265=y                 \
            --build-libvpx=y                  \
            --ffmpeg-git-dir=/tmp/ffmpeg_patched \
            --ffmpeg-git-checkout-version=HEAD  \
            --high-bitdepth=n                 \
            --build-intel-qsv=n               \
            --build-amd-amf=n

      # ----------------------------------------------
      # 5. 收集并上传编译产物
      # ----------------------------------------------
      - name: Collect artifacts
        run: |
          mkdir artifacts
          cp ffmpeg-windows-build-helpers/sandbox/cross_compilers/mingw-w64-x86_64/x86_64-w64-mingw32/bin/ffmpeg.exe artifacts/
          cp ffmpeg-windows-build-helpers/sandbox/cross_compilers/mingw-w64-x86_64/x86_64-w64-mingw32/bin/ffprobe.exe artifacts/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-xfade-easing
          paths: artifacts/*
          retention-days: 14
