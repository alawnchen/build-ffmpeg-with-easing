name: Build FFmpeg (Windows) with xfade-easing

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y             \
            git wget curl subversion       \
            build-essential pkg-config     \
            texinfo yasm cmake nasm        \
            gcc-mingw-w64-x86-64           \
            g++-mingw-w64-x86-64           \
            autoconf automake libtool      \
            libtool-bin m4                 \
            patch meson autogen gperf pax  \
            cvs ragel                      \
            autoconf-archive

      - name: Clone ffmpeg-windows-build-helpers
        run: git clone https://github.com/rdp/ffmpeg-windows-build-helpers.git

      - name: Prepare patched FFmpeg source
        run: |
          set -e
          git clone --depth 1 --branch n8.0 \
            https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg_patched
          cd /tmp/ffmpeg_patched
          git clone https://github.com/scriptituk/xfade-easing.git xfade_easing
          cp xfade_easing/src/xfade-easing.h libavfilter/
          if ! patch --dry-run -p0 < xfade_easing/src/vf_xfade.patch; then
            echo "::error::Patch does not apply cleanly. Check FFmpeg version."
            exit 1
          fi
          patch -p0 < xfade_easing/src/vf_xfade.patch
          git add -A
          git -c user.name="CI" -c user.email="ci@localhost" commit -m "apply xfade-easing"

      - name: Fix mpg123 autotools configuration
        run: |
          cd ffmpeg-windows-build-helpers
          # 预先准备 mpg123 的 autotools 文件
          if [ -d "sandbox/win64/mpg123_svn" ]; then
            cd sandbox/win64/mpg123_svn
            # 清理之前的 autotools 生成的文件
            rm -f configure config.h config.log config.status Makefile
            rm -rf autom4te.cache
            # 安装 autotools 必需的文件
            libtoolize --force --copy || glibtoolize --force --copy
            aclocal -I m4 2>/dev/null || true
            autoconf
            automake --add-missing --copy --force-missing 2>/dev/null || true
            cd ../../..
          fi

      - name: Patch build script to use GitHub mirrors for config.guess and config.sub
        run: |
          cd ffmpeg-windows-build-helpers
          # Find and patch all shell script files that download config.guess/config.sub
          find . -type f -name "*.sh" -exec sed -i \
            "s|http://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.guess;hb=HEAD|https://raw.githubusercontent.com/gcc-mirror/gcc/refs/heads/master/config.guess|g" {} \;
          find . -type f -name "*.sh" -exec sed -i \
            "s|http://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.sub;hb=HEAD|https://raw.githubusercontent.com/gcc-mirror/gcc/refs/heads/master/config.sub|g" {} \;

      - name: Run cross-compile script
        run: |
          cd ffmpeg-windows-build-helpers
          export TERM=dumb
          export FFMPEG_GIT_URL="file:///tmp/ffmpeg_patched"
          export LIBTOOLIZE=libtoolize
          ./cross_compile_ffmpeg.sh \
            --compiler-flavors=win64 \
            --disable-nonfree=y

      - name: Collect artifacts
        run: |
          mkdir artifacts
          cp ffmpeg-windows-build-helpers/sandbox/cross_compilers/mingw-w64-x86_64/x86_64-w64-mingw32/bin/ffmpeg.exe artifacts/
          cp ffmpeg-windows-build-helpers/sandbox/cross_compilers/mingw-w64-x86_64/x86_64-w64-mingw32/bin/ffprobe.exe artifacts/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-xfade-easing
          paths: artifacts/*
          retention-days: 14
