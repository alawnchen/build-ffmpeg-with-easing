name: Build FFmpeg with xfade‑easing
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git wget build-essential mingw-w64 python3-setuptools

      - name: Clone build helpers
        run: git clone https://github.com/rdp/ffmpeg-windows-build-helpers.git

      - name: Inject xfade‑easing patch code
        run: |
          cd ffmpeg-windows-build-helpers
          cat > inject_patch.sh <<'EOF'
#!/bin/bash
# 在build_ffmpeg函数中，cd "$output_dir"之后插入打补丁
awk '
/build_ffmpeg\(\) \{ {infunc=1}
infunc==1 && /cd "\$output_dir"/ {
    print $0
    print "git clone https://github.com/scriptituk/xfade-easing.git xfade_src"
    print "cp xfade_src/src/xfade-easing.h libavfilter/"
    print "patch -p1 < xfade_src/src/vf_xfade.patch"
    infunc=0
    next
}
1
' cross_compile_ffmpeg.sh > tmp.sh
mv tmp.sh cross_compile_ffmpeg.sh
chmod +x cross_compile_ffmpeg.sh
EOF
          chmod +x inject_patch.sh
          ./inject_patch.sh

      - name: Cross compile ffmpeg n8.0 static
        run: |
          cd ffmpeg-windows-build-helpers
          ./cross_compile_ffmpeg.sh \
            --ffmpeg-git-checkout-version=n8.0 \
            --build-non-free=n \
            --build-ffmpeg-static=y \
            --disable-opencl=y

      - name: Collect binaries
        run: |
          cp ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git/ffmpeg.exe ./ffmpeg-xfade-easing.exe
          cp ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git/ffprobe.exe ./ffprobe-xfade-easing.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-xfade-easing-win64
          paths: |
            ./ffmpeg-xfade-easing.exe
            ./ffprobe-xfade-easing.exe
          retention-days: 14
