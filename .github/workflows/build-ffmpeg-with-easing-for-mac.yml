# ==============================================================================
# 工作流：编译 FFmpeg n8.0 + xfade-easing v3.6.0 macOS 通用二进制
# ----------------------------------------------------------------------------
# 使用 GitHub Actions 矩阵策略在 macos-14 (arm64) 和 macos-13 (x86_64)
# 两个运行器上原生编译，将 xfade-easing 缓动过渡效果集成进 FFmpeg，
# 再通过 lipo 合并为同时支持 Apple Silicon 和 Intel 的通用二进制。
# ==============================================================================
name: 构建 FFmpeg xfade-easing (macOS Universal)

on:
  # 手动触发
  workflow_dispatch:
  push:
    # 推送到主分支时触发（含工作流文件自身的变更）
    branches:
      - main
      - master
    # 推送 v 开头的标签时触发，用于自动发布 GitHub Release
    tags:
      - 'v*'

# 环境变量：版本号与仓库地址集中管理，便于后续升级
env:
  FFMPEG_TAG: n8.0                          # FFmpeg 源码标签（必须使用 n8.0 以保证补丁兼容）
  XFADE_EASING_TAG: v3.6.0                  # xfade-easing 版本标签
  XFADE_BASE: https://raw.githubusercontent.com/scriptituk/xfade-easing/v3.6.0/src
  DEPS_PREFIX: /tmp/ffmpeg-deps             # 第三方编解码库静态安装前缀

# 发布 Release 需要对仓库内容的写入权限
permissions:
  contents: write

# 同一分支/标签的重复构建自动取消旧任务，节省资源
concurrency:
  group: build-ffmpeg-xfade-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1：矩阵构建 —— 在两个架构的 macOS 运行器上各自原生编译
  # ============================================================================
  build:
    name: 原生编译 FFmpeg (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3...)
          - runner: macos-14
            arch: arm64
            vpx_target: arm64-darwin-gcc
          # Intel
          - runner: macos-13
            arch: x86_64
            vpx_target: x86_64-darwin-gcc

    steps:
      # ----------------------------------------------------------------------
      # 步骤 1：安装构建依赖（Homebrew）
      # ----------------------------------------------------------------------
      - name: 安装构建依赖 (Homebrew)
        run: |
          set -e
          brew update
          brew install \
            nasm \
            automake \
            libtool \
            cmake \
            pkg-config \
            git \
            wget

      # ----------------------------------------------------------------------
      # 步骤 2：检出 FFmpeg 源码（精确到 n8.0 标签，浅克隆加速）
      # ----------------------------------------------------------------------
      - name: 检出 FFmpeg 源码 (tag ${{ env.FFMPEG_TAG }})
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: ${{ env.FFMPEG_TAG }}
          path: ffmpeg
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # 步骤 3：下载并应用 xfade-easing 补丁
      #   - 始终放入头文件 libavfilter/xfade-easing.h（header-only 实现）
      #   - 优先尝试 patch 方式修改 vf_xfade.c；失败则直接替换整个文件
      # ----------------------------------------------------------------------
      - name: 应用 xfade-easing 补丁 (tag ${{ env.XFADE_EASING_TAG }})
        working-directory: ffmpeg
        run: |
          set -e
          PATCH_URL="${XFADE_BASE}/vf_xfade.patch"
          HEADER_URL="${XFADE_BASE}/xfade-easing.h"
          FULL_C_URL="${XFADE_BASE}/vf_xfade.c"

          # 下载 header-only 头文件到 libavfilter 目录
          wget -O libavfilter/xfade-easing.h "${HEADER_URL}"

          # 下载补丁并做干运行（dry-run）验证
          # 依次尝试 -p0（README 推荐）和 -p1（git 风格），均失败则直接替换整个文件
          wget -O /tmp/vf_xfade.patch "${PATCH_URL}"

          if patch -p0 --dry-run < /tmp/vf_xfade.patch >/dev/null 2>&1; then
            echo "✓ 补丁 (p0) 可正常应用，执行 patch -b -u -N -p0"
            patch -b -u -N -p0 < /tmp/vf_xfade.patch
          elif patch -p1 --dry-run < /tmp/vf_xfade.patch >/dev/null 2>&1; then
            echo "✓ 补丁 (p1) 可正常应用，执行 patch -b -u -N -p1"
            patch -b -u -N -p1 < /tmp/vf_xfade.patch
          else
            echo "✗ 补丁无法直接应用，回退为直接替换 libavfilter/vf_xfade.c"
            wget -O libavfilter/vf_xfade.c "${FULL_C_URL}"
          fi

          echo "=== 验证关键文件已就位 ==="
          ls -la libavfilter/xfade-easing.h libavfilter/vf_xfade.c

      # ----------------------------------------------------------------------
      # 步骤 4：编译 libopus（静态原生编译，autotools）
      #   Opus 音频编解码器，构建最简单，最先编译
      # ----------------------------------------------------------------------
      - name: 编译 libopus (静态原生编译)
        run: |
          set -e
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git /tmp/opus
          cd /tmp/opus
          autoreconf -isf
          ./configure \
            --prefix=${DEPS_PREFIX} \
            --disable-shared \
            --enable-static \
            --disable-extra-programs
          make -j"$(sysctl -n hw.ncpu)"
          make install
          echo "=== libopus 安装完成 ==="
          ls -la ${DEPS_PREFIX}/lib/libopus.a ${DEPS_PREFIX}/lib/pkgconfig/opus.pc

      # ----------------------------------------------------------------------
      # 步骤 5：编译 libx264（静态原生编译，自定义 configure）
      #   H.264/AVC 视频编解码器
      # ----------------------------------------------------------------------
      - name: 编译 libx264 (静态原生编译)
        run: |
          set -e
          git clone --depth 1 https://github.com/mirror/x264.git /tmp/x264
          cd /tmp/x264
          ./configure \
            --prefix=${DEPS_PREFIX} \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-lavf \
            --disable-swscale
          make -j"$(sysctl -n hw.ncpu)"
          make install
          echo "=== libx264 安装完成 ==="
          ls -la ${DEPS_PREFIX}/lib/libx264.a ${DEPS_PREFIX}/lib/pkgconfig/x264.pc

      # ----------------------------------------------------------------------
      # 步骤 6：编译 libvpx（静态原生编译，自定义 configure）
      #   VP8/VP9 视频编解码器，含高位深支持
      # ----------------------------------------------------------------------
      - name: 编译 libvpx (静态原生编译)
        run: |
          set -e
          git clone --depth 1 --branch v1.14.1 https://github.com/webmproject/libvpx.git /tmp/libvpx
          cd /tmp/libvpx
          ./configure \
            --target=${{ matrix.vpx_target }} \
            --prefix=${DEPS_PREFIX} \
            --disable-shared \
            --enable-static \
            --enable-pic \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp9-highbitdepth
          make -j"$(sysctl -n hw.ncpu)"
          make install
          echo "=== libvpx 安装完成 ==="
          ls -la ${DEPS_PREFIX}/lib/libvpx.a ${DEPS_PREFIX}/lib/pkgconfig/vpx.pc

      # ----------------------------------------------------------------------
      # 步骤 7：编译 libx265（CMake 多位深静态原生编译）
      #   H.265/HEVC 视频编解码器，含 8/10/12-bit 多位深合并
      #   构建最复杂、耗时最长，放最后
      # ----------------------------------------------------------------------
      - name: 编译 libx265 (CMake 多位深静态原生编译)
        run: |
          set -e
          git clone --depth 1 --branch 3.5 https://bitbucket.org/multicoreware/x265_git.git /tmp/x265
          cd /tmp/x265

          # 修复新版 GCC/Clang 的 C++ 兼容性问题
          sed -i '' '1i\
          #include <cstdint>' source/dynamicHDR10/json11/json11.cpp

          # 12-bit 构建
          cmake \
            -DCMAKE_INSTALL_PREFIX=${DEPS_PREFIX} \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DCMAKE_ASM_NASM_FLAGS=-w-macro-params-legacy \
            -DHIGH_BIT_DEPTH=ON \
            -DEXPORT_C_API=OFF \
            -DENABLE_HDR10_PLUS=ON \
            -DMAIN12=ON \
            -S source \
            -B 12bit
          make -C 12bit -j"$(sysctl -n hw.ncpu)" &
          PID_12=$!

          # 10-bit 构建
          cmake \
            -DCMAKE_INSTALL_PREFIX=${DEPS_PREFIX} \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DCMAKE_ASM_NASM_FLAGS=-w-macro-params-legacy \
            -DHIGH_BIT_DEPTH=ON \
            -DEXPORT_C_API=OFF \
            -DENABLE_HDR10_PLUS=ON \
            -S source \
            -B 10bit
          make -C 10bit -j"$(sysctl -n hw.ncpu)" &
          PID_10=$!

          # 等待后台任务完成并传播退出码（裸 wait 始终返回 0，无法捕获失败）
          wait "$PID_12"
          wait "$PID_10"

          # 8-bit 构建（链接 10-bit 和 12-bit）
          cmake \
            -DCMAKE_INSTALL_PREFIX=${DEPS_PREFIX} \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DCMAKE_ASM_NASM_FLAGS=-w-macro-params-legacy \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS=-L. \
            -DLINKED_10BIT=ON \
            -DLINKED_12BIT=ON \
            -S source \
            -B 8bit
          make -C 8bit -j"$(sysctl -n hw.ncpu)"

          # 合并三个位深的静态库为单个 libx265.a
          # macOS 的 ar 不支持 -M 脚本模式，使用 libtool -static 合并
          cd 8bit
          mv ../12bit/libx265.a libx265_main12.a
          mv ../10bit/libx265.a libx265_main10.a
          mv libx265.a libx265_main.a

          libtool -static -o libx265.a libx265_main.a libx265_main10.a libx265_main12.a

          # 安装头文件和 pkgconfig
          make install

          # x265 是 C++ 库，需确保 x265.pc 的 Libs.private 包含 -lc++ 以支持静态链接
          # macOS 使用 libc++ 而非 libstdc++
          if ! grep '^Libs.private:.*-lc++' ${DEPS_PREFIX}/lib/pkgconfig/x265.pc >/dev/null 2>&1; then
            sed -i '' 's/^Libs.private:\(.*\)$/Libs.private:\1 -lc++/' ${DEPS_PREFIX}/lib/pkgconfig/x265.pc
          fi

          echo "=== libx265 安装完成 ==="
          ls -la ${DEPS_PREFIX}/lib/libx265.a ${DEPS_PREFIX}/lib/pkgconfig/x265.pc

      # ----------------------------------------------------------------------
      # 步骤 8：配置 FFmpeg 编译选项
      #   静态链接第三方编解码库，集成 x264/x265/vpx/opus
      #   macOS 使用 --target-os=darwin，各架构原生编译无需交叉编译参数
      # ----------------------------------------------------------------------
      - name: 配置 FFmpeg 编译选项
        working-directory: ffmpeg
        env:
          PKG_CONFIG_LIBDIR: ${{ env.DEPS_PREFIX }}/lib/pkgconfig
        run: |
          set -e
          ./configure \
            --arch=${{ matrix.arch }} \
            --target-os=darwin \
            --enable-static \
            --disable-shared \
            --extra-cflags="-I${DEPS_PREFIX}/include" \
            --extra-ldflags="-L${DEPS_PREFIX}/lib" \
            --pkg-config-flags="--static" \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus

      # ----------------------------------------------------------------------
      # 步骤 9：编译 FFmpeg
      #   使用 ECFLAGS 禁用 C99 混合声明警告，避免 xfade-easing 触发告警
      # ----------------------------------------------------------------------
      - name: 编译 FFmpeg
        working-directory: ffmpeg
        run: |
          set -e
          make -j"$(sysctl -n hw.ncpu)" ECFLAGS=-Wno-declaration-after-statement

      # ----------------------------------------------------------------------
      # 步骤 10：验证生成的二进制
      #   macOS 不支持完全静态链接，系统库动态链接是正常行为
      #   主要验证架构正确性和编解码库已静态链接
      # ----------------------------------------------------------------------
      - name: 验证二进制
        working-directory: ffmpeg
        run: |
          set -e
          echo "=== ffmpeg 架构信息 ==="
          file ffmpeg
          echo "=== ffprobe 架构信息 ==="
          file ffprobe
          echo "=== ffmpeg 动态库依赖 ==="
          otool -L ffmpeg
          echo "=== ffprobe 动态库依赖 ==="
          otool -L ffprobe
          echo "=== 文件信息 ==="
          ls -la ffmpeg ffprobe
          echo "=== 验证编解码库已静态链接 ==="
          # 检查是否包含 x264/x265/vpx/opus 符号
          nm ffmpeg 2>/dev/null | grep -E 'x264|x265|vpx|opus' | head -5 || echo "（符号可能被剥离，属正常）"

      # ----------------------------------------------------------------------
      # 步骤 11：上传构建产物，保留 30 天
      # ----------------------------------------------------------------------
      - name: 上传 ffmpeg 与 ffprobe (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-xfade-easing-codecs-macos-${{ matrix.arch }}
          path: |
            ffmpeg/ffmpeg
            ffmpeg/ffprobe
          retention-days: 30
          if-no-files-found: error

  # ============================================================================
  # Job 2：合并通用二进制 —— 依赖两个架构的构建产物
  # ============================================================================
  merge:
    name: 合并 macOS 通用二进制 (Universal)
    runs-on: macos-14
    needs: build
    continue-on-error: false

    steps:
      # ----------------------------------------------------------------------
      # 步骤 1：下载两个架构的构建产物
      # ----------------------------------------------------------------------
      - name: 下载 arm64 构建产物
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-xfade-easing-codecs-macos-arm64
          path: arm64

      - name: 下载 x86_64 构建产物
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-xfade-easing-codecs-macos-x86_64
          path: x86_64

      # ----------------------------------------------------------------------
      # 步骤 2：使用 lipo 合并通用二进制
      # ----------------------------------------------------------------------
      - name: 合并通用二进制 (lipo)
        run: |
          set -e
          mkdir -p universal
          lipo -create arm64/ffmpeg x86_64/ffmpeg -output universal/ffmpeg
          lipo -create arm64/ffprobe x86_64/ffprobe -output universal/ffprobe
          chmod +x universal/ffmpeg universal/ffprobe

      # ----------------------------------------------------------------------
      # 步骤 3：验证通用二进制
      # ----------------------------------------------------------------------
      - name: 验证通用二进制
        run: |
          set -e
          echo "=== ffmpeg 架构信息 ==="
          lipo -info universal/ffmpeg
          file universal/ffmpeg
          echo "=== ffprobe 架构信息 ==="
          lipo -info universal/ffprobe
          file universal/ffprobe
          echo "=== 文件信息 ==="
          ls -la universal/ffmpeg universal/ffprobe

      # ----------------------------------------------------------------------
      # 步骤 4：上传通用二进制产物，保留 30 天
      # ----------------------------------------------------------------------
      - name: 上传通用二进制
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-xfade-easing-codecs-macos-universal
          path: |
            universal/ffmpeg
            universal/ffprobe
          retention-days: 30
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # 步骤 5：发布 GitHub Release（仅当推送 v 开头标签时执行）
      # ----------------------------------------------------------------------
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: FFmpeg xfade-easing ${{ github.ref_name }}
          body: |
            基于 **FFmpeg ${{ env.FFMPEG_TAG }}** + **xfade-easing ${{ env.XFADE_EASING_TAG }}** 构建的 macOS 通用二进制。

            **同时支持 Apple Silicon (arm64) 和 Intel (x86_64) 架构。**

            集成编解码库：
            - libx264 (H.264/AVC)
            - libx265 (H.265/HEVC，含 8/10/12-bit 多位深)
            - libvpx (VP8/VP9，含高位深)
            - libopus (Opus 音频)
            - xfade-easing 缓动过渡效果

            - `ffmpeg` — 通用二进制，同时支持 arm64 和 x86_64
            - `ffprobe` — 媒体分析工具，通用二进制
          files: |
            universal/ffmpeg
            universal/ffprobe
          draft: false
          prerelease: false
